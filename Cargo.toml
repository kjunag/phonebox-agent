[package]
name = "phoneboxagent"
version = "0.1.0"
edition = "2024"
publish = false
description = "PhoneBox Linux agent in Rust"

[[bin]]
name = "phoneboxagent"
path = "src/main.rs"

[dependencies]
axum = "0.8"
futures-util = "0.3"
hex = "0.4"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
json_comments = "0.2"
openssl = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "process"] }
tokio-openssl = "0.6"
tower = "0.5"
